name: validate-skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group validation --locked
      - run: uv run python tools/audit_citations.py
      - run: >-
          uv run python skill/eeg-provenance/scripts/validate_ledger.py
          skill/eeg-provenance/assets/provenance-ledger.template.json
      - run: uv run pytest -m "not archive and not eegdash and not network"

  eegdash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group validation --group eegdash --locked
      - run: uv run pytest -m "eegdash and not archive and not network"
