name: validate-skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group validation --locked
      - run: uv run --group validation --locked python tools/audit_citations.py
      - run: >-
          uv run --group validation --locked python
          skill/eeg-provenance/scripts/validate_ledger.py
          skill/eeg-provenance/assets/provenance-ledger.template.json
      - run: >-
          uv run --group validation --locked pytest -m
          "not archive and not eegdash and not network and not adapters and not braindecode and not pyhealth"

  eegdash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group validation --group eegdash --locked
      - run: >-
          uv run --group validation --group eegdash --locked pytest -m
          "eegdash and not archive and not network"
